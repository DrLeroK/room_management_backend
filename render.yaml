# ==============================================================================
# Render Blueprint Specification for StayCraft Backend (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # StayCraft Django REST Framework Service
  # ----------------------------------------------------------------------------
  - type: web
    name: room-management-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: room-management-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,https://staycraft-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,http://localhost:3000
      - key: SEED_DATABASE
        value: "true"

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database Service on Render
# ------------------------------------------------------------------------------
databases:
  - name: room-management-postgres
    plan: free
    databaseName: room_management_db
    user: room_management_user
    region: oregon
