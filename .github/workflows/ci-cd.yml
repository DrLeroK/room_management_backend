# ==============================================================================
# GitHub Actions CI/CD Pipeline for StayCraft Room Management Backend
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting & Code Quality (Ruff)
  # ----------------------------------------------------------------------------
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check apps/ config/ tests/

      - name: Run Ruff Format Check
        run: ruff format --check apps/ config/ tests/

  # ----------------------------------------------------------------------------
  # Job 2: Test Suite with PostgreSQL
  # ----------------------------------------------------------------------------
  test:
    name: Database & Test Suite
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: room_management_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Migrations & Cache Table
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/room_management_test_db
          DJANGO_ENV: testing
          SECRET_KEY: ci-github-actions-secret-key-32chars-min
        run: |
          python manage.py migrate --noinput
          python manage.py createcachetable

      - name: Run Pytest Suite (Unit, Integration, E2E)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/room_management_test_db
          DJANGO_ENV: testing
          SECRET_KEY: ci-github-actions-secret-key-32chars-min
        run: |
          pytest apps/ tests/ --cov=apps --cov-report=term-missing

  # ----------------------------------------------------------------------------
  # Job 3: Docker Build Validation
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: staycraft-backend:latest
